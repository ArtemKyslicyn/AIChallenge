# Production stack — web on loopback only.
# NEVER publish host :443 or :8443 here (xray Reality + host nginx).
# Guard: scripts/assert-edge-safe.sh
# Usage: docker compose -f docker-compose.prod.yml up --build -d

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aichallenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-aichallenge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aichallenge} -d ${POSTGRES_DB:-aichallenge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aichallenge}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-aichallenge}
      SCENARIOS_DIR: /app/configs/scenarios
      LAB_DIR: /app/configs/lab
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_DIR: /app/data/media
    volumes:
      - ./configs/scenarios:/app/configs/scenarios:ro
      - ./configs/lab:/app/configs/lab:ro
      - media_data:/app/data/media
    depends_on:
      db:
        condition: service_healthy
      llm-proxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Bridges api -> host sing-box mixed proxy (127.0.0.1:11080) for OpenRouter etc.
  llm-proxy:
    image: alpine/socat:1.0.5
    # Host sing-box mixed proxy is on 172.18.0.1:11083 (docker bridge). Requires
    # iptables INPUT allow from 172.18.0.0/16 to tcp/11083 on the host.
    command: tcp-listen:11081,fork,reuseaddr tcp-connect:172.18.0.1:11083
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Published on loopback only; public TLS/HTTP is terminated by the host proxy.
      - "127.0.0.1:18080:80"
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
