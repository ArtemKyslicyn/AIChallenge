name: Invariant review

# Advisory policy review for AIChallenge. Separate from CI.
# No LLM key required. Exit 1 only when secret-like findings appear.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate review
        id: review
        run: |
          set +e
          if [ -n "${{ steps.range.outputs.base }}" ] && [ "${{ steps.range.outputs.base }}" != "0000000000000000000000000000000000000000" ]; then
            git diff "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" > /tmp/review.diff
          else
            git show --pretty=format: --unified=3 HEAD > /tmp/review.diff
          fi
          python3 scripts/review/cli.py --diff-file /tmp/review.diff > /tmp/review.md
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Invariant review"
            echo ""
            cat /tmp/review.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Comment on PR (idempotent)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review.md', 'utf8');
            const marker = '<!-- aichallenge-ai-review -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on secrets
        run: |
          python3 scripts/review/cli.py --diff-file /tmp/review.diff
          # exit code from rubric: 1 = secrets
