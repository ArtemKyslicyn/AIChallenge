name: Deploy

# Production deploy to VPS after CI is green on main (or manual run).
#
# Required GitHub Actions secrets (names only — values in GitHub UI):
#   DEPLOY_HOST   — e.g. example.invalid
#   DEPLOY_USER   — e.g. root
#   DEPLOY_SSH_KEY — private ed25519 key authorized on the server
#   DEPLOY_PATH   — e.g. APP_DIR
#
# Server must already have: Docker, cloned repo, and a local .env (never in git).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
