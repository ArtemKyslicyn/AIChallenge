<div id="planet-war-3d" class="vis-section-stack">
  <p class="vis-sr-only">
    Three-dimensional stylized planet war scene with cities and launching missiles. Previous conflict graphs remain separate. Illustrative artwork, not a real Earth map.
  </p>
  <div class="vis-column">
    <h2>Planet war board</h2>
    <p class="vis-text-muted">Volumetric globe · city lights · missile rise on declare</p>
  </div>
  <div class="vis-controls">
    <button type="button" id="planet-war-3d-go" class="vis-button">Declare war</button>
    <button type="button" id="planet-war-3d-reset" class="vis-button">Reset</button>
  </div>

    id="planet-war-3d-svg"
    role="img"
    width="100%"
    viewBox="0 0 960 700"
    aria-labelledby="planet-war-3d-title planet-war-3d-desc"
  >
    <title id="planet-war-3d-title">Three-dimensional planet with cities and war missiles</title>
    <desc id="planet-war-3d-desc">
      A shaded sphere with continents, glowing cities, and curved missile trajectories that launch when war is declared.
    </desc>

      <pattern id="pw-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">

      </pattern>
      <pattern id="pw-city-glow" width="4" height="4" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="light-dark(#ffd43b, #ffe066)" opacity="0.8" />
      </pattern>
      <clipPath id="pw-globe-clip">
        <circle cx="480" cy="340" r="230" />
      </clipPath>
      <marker id="pw-head" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
        <path d="M0,0 L8,3.5 L0,7 Z" fill="light-dark(#fa5252, #ff8787)" />
      </marker>
    </defs>

        --ocean-deep: light-dark(#12324a, #061018);
        --ocean: light-dark(#1c4d6e, #0a2233);
        --ocean-lit: light-dark(#2f6f96, #143d57);
        --land: light-dark(#3d6b45, #1f3d28);
        --land-lit: light-dark(#6a9a58, #3f6b3a);
        --land-dark: light-dark(#24402c, #102018);
        --rim: light-dark(#7eb6d8, #3d7ea3);
        --city: light-dark(#ffe066, #ffec99);
        --city-core: light-dark(#fff9db, #ffffff);
        --war: light-dark(#e03131, #ff6b6b);
        --trail: light-dark(#ff922b, #ffc078);
        --ui: light-dark(#e7ecf5, #dbe4f0);
        --muted: light-dark(#8b9bb4, #7b8ba6);
      }
      #planet-war-3d-svg .void { fill: var(--void); }
      #planet-war-3d-svg .star { fill: var(--star); }
      #planet-war-3d-svg .ocean-deep { fill: var(--ocean-deep); }
      #planet-war-3d-svg .ocean { fill: var(--ocean); }
      #planet-war-3d-svg .ocean-lit { fill: var(--ocean-lit); }
      #planet-war-3d-svg .land { fill: var(--land); }
      #planet-war-3d-svg .land-lit { fill: var(--land-lit); }

      #planet-war-3d-svg .rim {

        opacity: 0;

      #planet-war-3d-svg .plume {

        opacity: 0;

      #planet-war-3d-svg .flash {

      #planet-war-3d-svg .radar {
        fill: none;

<script>
(function () {
  var root = document.getElementById("planet-war-3d");
  if (!root) return;
  var svg = document.getElementById("planet-war-3d-svg");
  var go = document.getElementById("planet-war-3d-go");
  var resetBtn = document.getElementById("planet-war-3d-reset");
  var status = document.getElementById("planet-war-3d-status");
  var hint = document.getElementById("pw-hint");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var busy = false;

  function pointAt(path, t) {
    var len = path.getTotalLength();
    var u = Math.max(0, Math.min(1, t));
    var a = path.getPointAtLength(u * len);
    var b = path.getPointAtLength(Math.min(1, u + 0.01) * len);
    return {
      x: a.x,
      y: a.y,
      angle: (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI,
    };
  }

  function setOp(sel, v) {
    svg.querySelectorAll(sel).forEach(function (el) {
      el.style.opacity = String(v);
    });
  }

  function hardReset() {
    root.classList.remove("war-on");
    if (hint) hint.style.opacity = "1";
    setOp(".trail", 0);
    setOp(".missile", 0);
    setOp(".fin", 0);
    setOp(".plume", 0);
    setOp(".flash", 0);
    setOp(".radar", 0);
    svg.querySelectorAll(".trail").forEach(function (p) {
      p.style.strokeDasharray = "100";
      p.style.strokeDashoffset = "100";
    });
    svg.querySelectorAll(".pw-m").forEach(function (m) {
      m.setAttribute("transform", "translate(-80 -80)");
    });
    svg.querySelectorAll(".radar").forEach(function (r) {
      r.setAttribute("r", "12");
    });
    status.textContent = "Globe reset · cities online.";
    busy = false;
    go.disabled = false;
  }

  function declareWar() {
    if (busy) return;
    busy = true;
    go.disabled = true;
    root.classList.add("war-on");
    if (hint) hint.style.opacity = "0";
    status.textContent = reduce
      ? "War declared · static corridors."
      : "War declared · missiles climbing off the limb…";

    var trails = svg.querySelectorAll(".trail");
    var missiles = svg.querySelectorAll(".pw-m");
    var radars = svg.querySelectorAll(".radar");
    var flashes = svg.querySelectorAll(".flash");

    if (reduce) {
      setOp(".trail", 0.95);
      setOp(".radar", 0.75);
      trails.forEach(function (p) {
        p.style.strokeDasharray = "none";
        p.style.strokeDashoffset = "0";
      });
      busy = false;
      go.disabled = false;
      status.textContent = "War declared · arcs shown.";
      return;
    }

    var t0 = null;
    var pulse = 650;
    var flight = 2400;

    radars.forEach(function (r) {
      r.style.opacity = "0.9";
    });

    function frame(ts) {
      if (!t0) t0 = ts;
      var elapsed = ts - t0;

      if (elapsed < pulse) {
        var p = elapsed / pulse;
        radars.forEach(function (r) {
          r.setAttribute("r", String(12 + p * 36));
          r.style.opacity = String(0.9 * (1 - p * 0.55));
        });
        requestAnimationFrame(frame);
        return;
      }

      var t = Math.min(1, (elapsed - pulse) / flight);
      var ease = 1 - Math.pow(1 - t, 2.6);
      var liftPhase = Math.min(1, t / 0.2);

      if (t > 0.02) {
        setOp(".missile", 1);
        setOp(".fin", 1);
        setOp(".plume", 0.7);
      }

      trails.forEach(function (path) {
        path.style.opacity = "0.95";
        path.style.strokeDasharray = "100";
        path.style.strokeDashoffset = String(100 - ease * 100);
      });

      missiles.forEach(function (m) {
        var path = document.getElementById(m.getAttribute("data-path"));
        if (!path) return;
        var climb = (1 - liftPhase) * 55;
        var pt = pointAt(path, ease);
        m.setAttribute(
          "transform",
          "translate(" + pt.x + " " + (pt.y - climb) + ") rotate(" + pt.angle + ")"
        );
        var fade = t > 0.9 ? 1 - (t - 0.9) / 0.1 : 1;
        m.querySelectorAll(".missile, .fin").forEach(function (part) {
          part.style.opacity = String(fade);
        });
        var plume = m.querySelector(".plume");
        if (plume) plume.style.opacity = String(0.65 * fade);
      });

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        flashes.forEach(function (f, i) {
          f.style.opacity = "1";
          var start = performance.now();
          function boom(now) {
            var bt = Math.min(1, (now - start) / 520);
            f.setAttribute("r", String(7 + bt * 30 + i));
            f.style.opacity = String(1 - bt);
            if (bt < 1) requestAnimationFrame(boom);
          }
          requestAnimationFrame(boom);
        });
        setOp(".missile", 0);
        setOp(".fin", 0);
        setOp(".plume", 0);
        status.textContent = "Strike complete · previous graphs still available separately.";
        busy = false;
        go.disabled = false;
      }
    }
    requestAnimationFrame(frame);
  }

  go.addEventListener("click", declareWar);
  resetBtn.addEventListener("click", hardReset);
  hardReset();
  window.__aichallengeConflictFx = window.__aichallengeConflictFx || {};
  window.__aichallengeConflictFx.planet = {
    declareWar: declareWar,
    reset: hardReset,
  };
})();
</script>
