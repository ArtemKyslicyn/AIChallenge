server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve upstream at request time so boot order
    # does not break nginx when `api` is not yet in the network DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
    # Unique hostname — never bare `api` (ops-console also joins this network).
    set $api_upstream http://aichallenge-api:8000;
    proxy_pass $api_upstream;
        proxy_http_version 1.1;

        # SSE: nginx must not sit on the stream, and a long answer must not be
        # cut at the default 60s read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
