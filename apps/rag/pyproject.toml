[project]
name = "aichallenge-rag"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "numpy>=2.0",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "mcp>=1.13,<2",
  "pypdf>=5.0",
  "qdrant-client>=1.12",
]

[project.optional-dependencies]
local = [
  "sentence-transformers>=3.0",
]

[project.scripts]
aichallenge-rag = "aichallenge_rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aichallenge_rag"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
