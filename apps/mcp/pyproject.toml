[project]
name = "aichallenge-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.13,<2",
  "uvicorn[standard]>=0.32",
  "starlette>=0.41",
]

[project.scripts]
aichallenge-mcp = "aichallenge_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aichallenge_mcp"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
