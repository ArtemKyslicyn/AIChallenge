# Рубрика судьи качества (G-Eval style form filling).
#
# Лежит здесь, а не в коде, потому что рубрику будут крутить: порог, формулировки
# и акценты критериев меняются чаще, чем выкатывается образ.
#
# Плейсхолдеры {question} и {answer} подставляются буквальной заменой, а не
# str.format — иначе пример JSON-формата ниже сломал бы подстановку.
system: |
  Ты оцениваешь ответ ассистента по трём критериям. Отвечай строго JSON-объектом
  без пояснений и без ограждения кода.
template: |
  Вопрос:
  {question}

  Ответ:
  {answer}

  Оцени каждый критерий целым числом от 0 до 5:
  - relevance — отвечает ли текст на заданный вопрос
  - completeness — покрыта ли суть вопроса
  - clarity — понятно ли написано, без противоречий и обрывов

  Формат: {"relevance": N, "completeness": N, "clarity": N}
