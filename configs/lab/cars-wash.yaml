id: cars-wash
title: Автомойка (логика)
category: logic
difficulty: medium
task: >
  Если 5 машин за 5 минут моют 5 автомобилей, сколько машин нужно,
  чтобы за 100 минут вымыть 100 автомобилей? Ответ — одно число и краткое
  объяснение.
golden_answer: "5"
golden_hint: "Скорость одна машина на машину за 5 минут; для 100 авто за 100 мин достаточно 5 машин."
rubric: >
  Ответ 5. Не путать с линейной пропорцией «нужно 100 машин».
