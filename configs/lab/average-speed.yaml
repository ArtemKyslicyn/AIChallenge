id: average-speed
title: Средняя скорость
category: math
difficulty: medium
task: >
  Автомобиль проехал половину пути со скоростью 60 км/ч, а вторую половину —
  со скоростью 40 км/ч. Какова средняя скорость на всём пути? Ответ в км/ч
  и краткий вывод.
golden_answer: "48"
golden_hint: "Гармоническое среднее: 2ab/(a+b) = 2·60·40/100 = 48"
rubric: >
  Ответ 48 км/ч (не арифметическое среднее 50).
