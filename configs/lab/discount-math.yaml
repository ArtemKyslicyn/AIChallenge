id: discount-math
title: Скидка в магазине
category: math
difficulty: easy
task: >
  В магазине акция: при покупке от 3 товаров скидка 10% на каждый,
  от 5 — 15%. Товар стоит 400 ₽. Клиент хочет купить ровно 4 штуки.
  Сколько заплатит? Покажите расчёт и проверку.
golden_answer: "1440"
golden_hint: "4 × 400 = 1600; скидка 10% → 1440 ₽"
rubric: >
  Верный итог 1440 ₽. Учтена скидка 10% (не 15%). Есть расчёт и проверка.
