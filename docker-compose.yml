# Local stack. `docker compose up --build` works with no .env at all: with no
# provider key the API falls back to FakeLLMProvider. A real .env overrides the
# defaults below — Compose reads it for interpolation automatically.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aichallenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-aichallenge}
    ports:
      # Exposed so the integration suite can run from the host.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aichallenge} -d ${POSTGRES_DB:-aichallenge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      # Secrets stay in the file rather than in the interpolated Compose config.
      - path: .env
        required: false
    environment:
      # Always point at the db service, whatever a local .env says.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aichallenge}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-aichallenge}
      SCENARIOS_DIR: /app/configs/scenarios
      LAB_DIR: /app/configs/lab
      BENCHMARKS_DIR: /app/configs/benchmarks
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_DIR: /app/data/media
      MCP_BASE_URL: ${MCP_BASE_URL:-http://mcp:18765}
      MCP_SHARED_TOKEN: ${MCP_SHARED_TOKEN:-}
      RAG_BASE_URL: ${RAG_BASE_URL:-http://rag:18766}
      RAG_SHARED_TOKEN: ${RAG_SHARED_TOKEN:-${MCP_SHARED_TOKEN:-}}
    volumes:
      # Scenarios are configuration, not code: editable without a rebuild.
      - ./configs/scenarios:/app/configs/scenarios:ro
      - ./configs/lab:/app/configs/lab:ro
      - ./configs/benchmarks:/app/configs/benchmarks
      - media_data:/app/data/media
    depends_on:
      db:
        condition: service_healthy
      rag:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      # No curl in a slim image — use the interpreter that is already there.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  mcp:
    build:
      context: ./apps/mcp
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: http
      MCP_SHARED_TOKEN: ${MCP_SHARED_TOKEN:-}
      STAND_API_URL: ${STAND_API_URL:-http://api:8000}
      MCP_DATA_DIR: /app/data
    volumes:
      - mcp_data:/app/data
    ports:
      - "127.0.0.1:18765:18765"
    restart: unless-stopped

  rag:
    build:
      context: ./apps/rag
    env_file:
      - path: .env
        required: false
    environment:
      RAG_SHARED_TOKEN: ${RAG_SHARED_TOKEN:-${MCP_SHARED_TOKEN:-}}
      RAG_DATA_DIR: /app/data
      RAG_CORPUS_DIR: /app/corpus
      RAG_CHUNK_STRATEGY: ${RAG_CHUNK_STRATEGY:-structural}
      # Empty = embedded Qdrant under /app/data/qdrant. Set to use a server, e.g. http://qdrant:6333
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-aichallenge_rag}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-api}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://routerai.ru/api/v1}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://routerai.ru/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ROUTERAI_KEY: ${ROUTERAI_KEY:-}
      LOCAL_EMBEDDINGS_ENABLED: ${LOCAL_EMBEDDINGS_ENABLED:-false}
    volumes:
      - rag_data:/app/data
      - ./docs:/app/corpus/docs:ro
      - ./README.md:/app/corpus/README.md:ro
      - ./AGENTS.md:/app/corpus/AGENTS.md:ro
      - ./CLAUDE.md:/app/corpus/CLAUDE.md:ro
    ports:
      # Loopback only — tunnel or Guest MCP for external access.
      - "127.0.0.1:18766:18766"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  media_data:
  mcp_data:
  rag_data:
